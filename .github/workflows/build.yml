name: build
on: [push, pull_request]
jobs:
  build:
    # Self-hosted Mac Studio runner on a public fork: never run code from a fork's PR.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, ARM64, everest, macstudio]
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests (no keyboard needed)
        run: swift test
      - name: Build
        run: swift build -c release
      - name: Build the app bundle
        run: ./make-app.sh --zip
      - uses: actions/upload-artifact@v4
        with:
          name: Everest-app
          path: Everest-*.zip
          retention-days: 3
